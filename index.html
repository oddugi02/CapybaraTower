<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Capy-Zen Stack — 카피바라 온천 탑 쌓기." />
    <meta property="og:title" content="Capy-Zen Stack | 카피바라 온천 탑 쌓기" />
    <title>Capy-Zen Stack — 카피바라 온천 탑 쌓기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Retro Bitmap Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/Galmuri@latest/dist/Galmuri.css" />

    <script>
      /** GitHub Pages 하위 경로(/CapybaraTower) 접속 시 끝에 /가 없으면 경로 오류가 발생하므로 자동 추가 */
      (function() {
        const path = window.location.pathname;
        if (path.endsWith('/CapybaraTower')) {
          window.location.replace(path + '/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <!-- 게임 캔버스 -->
        <canvas id="capy-canvas" aria-label="카피바라 온천 탑 쌓기 게임"></canvas>

        <!-- 폭죽 오버레이 캔버스 -->
        <canvas id="fireworks-canvas" class="fireworks-canvas hidden" aria-hidden="true"></canvas>

        <!-- HUD -->
        <div id="game-hud" class="game-hud">
          <div class="game-hud__goal">목표: 36층</div>
          <div class="game-hud__score">쌓은 층 <span id="score-val">0</span></div>
        </div>

        <!-- 낙하 물체 태그 -->
        <div id="falling-ob-tag" class="obstacle-tag obstacle-tag--hidden" aria-hidden="true"></div>

        <!-- 성공 시 우상단 액션 버튼 (hidden until win) -->
        <div id="win-actions" class="win-actions hidden">
          <button type="button" id="btn-download" class="win-action-btn" aria-label="이미지 저장">
            <!-- download icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button type="button" id="btn-reset-win" class="win-action-btn" aria-label="다시 하기">
            <!-- reset icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>

        <!-- 게임 오버 -->
        <div id="game-over" class="game-over hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
          <p id="game-over-title" class="game-over__title">풍덩… 온천에 빠졌습니다</p>
          <p class="game-over__score">쌓은 층: <span id="final-score">0</span></p>
          <button type="button" id="restart-btn" class="game-over__btn">다시 도전 🌿</button>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
